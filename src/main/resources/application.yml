server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tests_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: # PAROLA VOASTRĂ MYSQL

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
jwt:
  secret: mySecretKey12345678901234567890123456789012345678901234567890
  expiration: 86400 # 24 ore în secunde

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    com.example: DEBUG
    org.hibernate.SQL: DEBUG