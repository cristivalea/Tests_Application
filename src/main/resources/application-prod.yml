server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tests_app}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate  # În producție folosim 'validate' nu 'update'
    show-sql: false  # Dezactivăm SQL logging în producție

jwt:
  secret: ${JWT_SECRET:your-production-secret-key-here}
  expiration: ${JWT_EXPIRATION:86400}

logging:
  level:
    org.springframework.security: WARN
    com.example: INFO
    org.hibernate.SQL: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: app.log